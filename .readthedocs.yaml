# Read the Docs build for the AusMT documentation.
#
# DOCUMENTATION VERSIONS FOLLOW THE MTCAT SCHEMA VERSION. When the schema version changes, tag the
# merge commit `docs-mtcat-<version>` (annotated) and activate that tag as a version in the Read the
# Docs project. `latest` follows the default branch. The tags are the version list; nothing here or
# anywhere else in the repository enumerates them, so a cut needs no file change.
# The reader-facing statement of the same convention is docs/docs/reference/index.md.
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
mkdocs:
  configuration: docs/mkdocs.yml
python:
  install:
    - requirements: docs/requirements.txt
