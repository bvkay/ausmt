# AusMT portal configuration — the primary home for branding, version and deployment settings.
# Edit this file and regenerate config.js with tools/gen_config.py for anything it covers. A full
# re-brand or re-deploy also touches hardcoded constants elsewhere in the portal: page titles,
# wordmarks and footers in index.html / about.html / add-survey.html, citation strings in
# src/state.js, src/exports.js and src/drawer.js, and fallback defaults in version.js and
# tools/gen_config.py. The science build also reads this file for the MTCAT portal block.
portal:
  id: ausmt                 # MTCAT portal_id, stable, lowercase, unique per portal (federation key)
  name: Australian Magnetotelluric Data Portal
  short_name: AusMT         # shown in the wordmark / header chip
  region: Australia
  schema: MTCAT             # discovery-document schema name (do not change)
  # The MTCAT schema version is DELIBERATELY NOT declared here (ratified MTCAT 2.0 version
  # machinery): it is not a deployment knob but a property of the schema this tree ships, so
  # tools/gen_config.py GENERATES it into config.js from the single source, the MTCAT_VERSION
  # constant in contract/generate.py. Declaring a schema_version key here would reintroduce the
  # duplicated-literal class that bit three review rounds running; the parity pin
  # (engine/tests/test_mtcat_version_parity.py) fails if the key reappears.
  version: "0.2.1"          # AusMT release version — keep in step with engine/pyproject.toml; shown as "AusMT v0.2.1"

deployment:
  pages_base_url: ""        # e.g. https://<user>.github.io/ausmt  (blank = relative paths)
  mtcat_url: ""             # public URL of mtcat.json once deployed (blank = data/mtcat.json)
  data_base_url: ""         # where the engine publishes data/*.json, e.g.
                            # https://<user>.github.io/ausmt/data (blank = portal's own ./data)

analytics:
  enabled: false            # privacy-respecting, cookieless; OFF by default
  plausible_domain: ""      # e.g. ausmt.org.au - only used when enabled: true

basemap:
  provider: carto           # carto (hosted raster) | pmtiles (self-hosted vector, once deployed)
  carto_api_key: ""         # CARTO watermarks un-keyed raster tiles; the free key is a deployment
                            # value, so it lives here and rides gen_config into config.js. Public by
                            # nature (it ships in the tile URL).

# Distribution feature flags (the download backbone). The science build reads these too; the
# manifest is authoritative for what actually exists, so these are the publish-time switches.
flags:
  survey_h5_enabled: true         # tier 2: publish a per-survey aggregated MTH5 bundle (<slug>-tf.h5)
  station_h5_enabled: true        # tier 1: publish one MTH5 per served station (h5/<slug>/<station>.h5). NOTE this YAML is NOT in the engine image: the production enable is --station-h5 on deploy/Makefile's rebuild-data.
  collection_download_enabled: false  # reserved: collection-level bundle DOWNLOAD tile in the portal (paired with the tier-3 producer below)
  collection_h5_enabled: false    # tier 3: gate the collection PRODUCER (emit_collection_mth5). Designed-but-disabled by construction; confirm AusLAMP member counts before flipping.
  max_collection_stations: 600    # tier-3 RAM ceiling: refuse a collection build above this so an AusLAMP-national-sized ~6 GiB build cannot OOM the host.
