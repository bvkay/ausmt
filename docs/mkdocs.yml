theme:
  name: readthedocs
  # overrides/main.html replaces two blocks so the sidebar header and the mobile bar carry the AusMT
  # lockup (AuScope mark, wordmark, tagline, then Documentation on its own line) instead of the
  # theme's plain site-name link. The theme's own `logo` option renders an image INSTEAD of the name
  # rather than beside it, which is why this is a template override and not a theme setting.
  custom_dir: overrides

# Brand palette and table wrapping, layered on the theme's stylesheets. The file's header says what
# each block replaces and why.
extra_css:
  - css/ausmt.css
