name: gateway-ci

# The gateway (submission intake + antivirus + curator publish flow) is a first-class subsystem
# that took real community submissions this week, yet before C35a NO workflow ran its unit suite
# and ruff excluded it entirely (code-health review F1). This job closes that hole: it runs the
# gateway unit suite and lints gateway/ on every gateway-touching push/PR, so a gateway source
# change is TESTED before it can ship inside an unrelated deploy-triggered image rebuild.
#
# The pytest command below covers gateway/tests AND deploy/tests. Measured on the dev box
# (2026-08-25, full engine stack installed): ~1,220 tests, ~4 minutes. This header claimed "179
# passed, ~10s" long after both had trebled, so read the figures as a dated scale that needs
# re-measuring, not a contract. The suite drives async bodies via asyncio.run(), so no
# pytest-asyncio plugin is needed (see gateway/requirements-dev.txt). The runner is STACK-LESS (no
# mt_metadata), so the same collection skips the engine-stack pins accounted for at the tripwire
# step below: a 0-skip run is a dev-box property, not this lane's.
#
# PATH-SCOPED (ADR-001 monorepo): runs when the gateway/ OR deploy/ subtree (or this workflow)
# changes. deploy/ is here because the deploy unit tests (deploy/tests) were wired into this lane's
# pytest invocation in PR #19 — but the trigger paths never followed, so a deploy-only change could
# merge without its own tests ever running in CI (caught 2026-07-10: the backup-hardening branch
# touched only deploy/** and would have merged hollow-green).

on:
  workflow_dispatch:
  # H4/R27: the ts-routes drift gate below must fire on the change that triggers it, and that change
  # (a register edit) lands in the SEPARATE ausmt-surveys repo, which never touches a path this
  # workflow watches. So the surveys repo's ts-routes-dispatch.yml fires this event on a register
  # change, and it re-runs the gate against the freshly pushed registers. One source of truth: the
  # check lives here, the surveys repo is only the trigger.
  repository_dispatch:
    types: [ts-registers-changed]
  push:
    paths:
      - "gateway/**"
      - "deploy/**"
      - ".github/workflows/gateway-ci.yml"
  pull_request:
    paths:
      - "gateway/**"
      - "deploy/**"
      - ".github/workflows/gateway-ci.yml"

concurrency:
  group: gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches the gateway image + the tested ausmt env

      - name: Install gateway test deps
        run: pip install -r gateway/requirements-dev.txt

      # Install Caddy so the deploy/ access-log masking pins RUN here instead of skipping (C43 S2b-ii,
      # C45 privacy). The masked-log runtime pin (test_caddy_log_masking.py) is the executable proof
      # that the public privacy promise — "a full IP address is never stored" — is TRUE: it drives a
      # real request with X-Forwarded-For through running Caddy and asserts the full IP appears NOWHERE
      # in the log line, only the /24-masked form. A config-syntax assertion is NOT sufficient for a
      # public commitment. Without caddy on PATH these pins skip, and the skip tripwire (below) FAILS
      # loudly rather than let the privacy proof silently no-op — so this step is load-bearing, not
      # optional. Pinned version for reproducibility (the box runs caddy:2-alpine, current 2.x).
      # 2.11.4 since the THREDDS lane: the hand-off routes add a `map` with a FILE `import` and an
      # `expression` matcher, and every runtime pin for them - plus the front door's own `caddy
      # validate` step and the route table's measured adapt cost - was taken at 2.11.4. Running the
      # lane's only unattended Caddy at 2.8.4 would leave that construct unverified at the version
      # CI actually uses, while the box has been ahead of 2.8.4 the whole time (caddy:2-alpine).
      - name: Install Caddy (deploy access-log masking pins)
        run: |
          CADDY_VERSION=2.11.4
          curl -fsSL -o /tmp/caddy.tar.gz \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/caddy.tar.gz -C /tmp caddy
          sudo install /tmp/caddy /usr/local/bin/caddy
          caddy version

      # Lint gateway/ with the SAME ruff pin + config the engine lane uses (build-products.yml:48-49):
      # ruff==0.15.17 with engine/pyproject.toml's [tool.ruff] select/ignore set. The gateway ships no
      # own ruff config, so the engine's project-wide config is the single source of the lint policy.
      - name: Lint (ruff)
        run: |
          python -m pip install ruff==0.15.17
          python -m ruff check --config engine/pyproject.toml gateway/

      # From the REPO ROOT (not gateway/) so `import gateway...` resolves as a package, exactly as
      # the command that passed locally. -rs surfaces every skip reason in the log.
      #
      # THE VALIDATOR ARM IS DECLARED HERE, NOT INHERITED FROM STEP ORDER. AUSMT_FORCE_VENDORED_VALIDATOR=1
      # pins the cross-repo validator oracles to the COMMITTED vendored copy (see
      # gateway/tests/conftest.py::resolve_validator_dir). The "Route-table drift gate" step BELOW clones
      # ausmt-surveys into $GITHUB_WORKSPACE/../ausmt-surveys, which is EXACTLY the directory that resolver
      # treats as the live sibling: without this flag the validator ~120 oracles compare against would be
      # decided by which step happens to run first, so reordering these two steps, adding a second pytest
      # invocation after the clone, or reusing a workspace would move them off the sha-pinned contract with
      # nothing red. gateway/tests/test_validator_resolution.py asserts this env var is set here.
      #
      # C35b/D5: pipe the report through the skip tripwire with the gateway lane's OWN allow-list
      # (--allow REPLACES the engine built-in). That one reason excuses every pin that needs the real
      # engine stack (mt_metadata), which this runner does not install: 22 tests across four files as of
      # 2026-08-25 - test_runner.py's two real-engine e2e oracles, test_collections_runner.py's two engine
      # parity pins, and the module-scoped engine-corpus fixtures behind test_c43_stage2a_js_parity.py (3)
      # and test_c43_hub_js_parity.py (15). ci_check_skips.py matches by SUBSTRING, so a new test joins the
      # allow-list simply by copying the string: keep it for engine-stack absence and nothing else. tee
      # keeps the full pytest output in the human log AND feeds the tripwire; `set -o pipefail` so a pytest
      # FAILURE (not just a skip regression) still reds the lane through the pipe. Any OTHER skip - e.g. a
      # validator oracle regressing to skip, the exact F7 hole - fails the lane loudly.
      # deploy/tests rides this lane too (C40): the reconcile.sh decision-logic tests are plain
      # pytest + sh + git, all present on the runner — including flock(1), so the lock-held case that
      # skips on a Windows dev box RUNS here (no new allow-list entry; a skip would trip the wire).
      - name: Gateway unit tests (+ loud skip accounting)
        env:
          AUSMT_FORCE_VENDORED_VALIDATOR: "1"
        run: |
          set -o pipefail
          python -m pytest -q -rs gateway/tests deploy/tests | tee gateway-pytest.out
          python engine/tests/ci_check_skips.py \
            --allow "real engine stack / sample survey / validator not present" < gateway-pytest.out

      # THE ROUTE TABLE'S MEMBERSHIP IS THE R5 SUPPRESSION, so a committed ts-routes.map that names a
      # route the registers no longer admit is an access decision nobody made. deploy/tests validates
      # the shipped table's SHAPE, but it holds no registers to compare it against, so only
      # `gen_ts_routes.py --check` can catch a register that moved without the table.
      #
      # The registers live in the SEPARATE ausmt-surveys repo, so this needs a sibling checkout at the
      # exact path the generator resolves ($GITHUB_WORKSPACE/../ausmt-surveys). Same wiring as
      # deploy-images.yml's validator clone, same no-silent-skip posture: with the var set, a clone
      # failure is a hard error and the check gates the lane.
      #
      # H4/R27 - "cannot check" must NEVER read as "checked and clean". This step used to `exit 0`
      # green when AUSMT_SURVEYS_URL was unset, so a committed table that no longer matched the
      # registers merged undetected. Now an inability to run the gate is a HARD FAILURE everywhere the
      # secret is available (push, same-repo PR, workflow_dispatch, and the ts-registers-changed
      # dispatch that is the gate's real trigger). The ONE documented exception is a fork PR: GitHub
      # withholds this repo's secrets from fork-triggered runs, so a fork legitimately cannot clone a
      # private registers repo. There we annotate loudly and skip rather than wedge an unrelated
      # contributor's PR; the gate still runs on merge to the default branch and on the surveys-repo
      # dispatch, and doctor-box.sh's ts-route key-set parity leg is the post-publication backstop.
      #
      # COUPLING: DEST below is the SAME directory gateway/tests/conftest.py resolves as the live
      # validator sibling, so this clone makes a sibling validator appear mid-job. The unit-test step
      # above is insulated from that by AUSMT_FORCE_VENDORED_VALIDATOR=1, and only by that - do not run
      # pytest after this step, and do not move this step above it, without deciding on purpose which
      # validator the oracles should compare against.
      - name: Route-table drift gate (gen_ts_routes.py --check)
        env:
          SURVEYS_URL: ${{ vars.AUSMT_SURVEYS_URL }}
          SURVEYS_TOKEN: ${{ secrets.AUSMT_SURVEYS_TOKEN }}
          # True ONLY for a PR whose head repo is a FORK of this one; false for push, same-repo PR,
          # workflow_dispatch and repository_dispatch. It is the one context where this repo's secrets
          # are legitimately unavailable, so it is the one context where a "cannot check" is a skip
          # rather than a hard fail (see fail_or_skip below).
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          DEST="$GITHUB_WORKSPACE/../ausmt-surveys"
          # "Cannot run the gate" resolves to a HARD FAIL everywhere the registers secret is available,
          # and to a loud SKIP only on a fork PR (which cannot see the secret). This keeps H4/R27's
          # rule - "cannot check" never reads as "checked and clean" - without wedging fork PRs.
          fail_or_skip() {   # $1 = human-readable reason
            if [ "$IS_FORK_PR" = "true" ]; then
              echo "::warning::$1 - SKIPPED on this fork PR, which cannot access the registers secret. The gate still runs on merge to the default branch and on the ausmt-surveys ts-registers-changed dispatch."
              {
                echo "### gateway-ci: route-table drift gate SKIPPED (fork PR)"
                echo ""
                echo "\`deploy/frontdoor/ts-routes.map\` MEMBERSHIP is the R5 suppression, and only"
                echo "\`gen_ts_routes.py --check\` can compare it against the registers it was generated from."
                echo "A fork PR cannot read this repo's secrets, so it cannot clone the registers repo."
                echo "This is NOT a green result for the map - the authoritative runs are:"
                echo "* push / merge to the default branch and \`workflow_dispatch\` here;"
                echo "* the \`ts-registers-changed\` dispatch fired by ausmt-surveys on a register change;"
                echo "* \`doctor-box.sh\`'s ts-route key-set parity leg, the post-publication backstop."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::$1"
            exit 1
          }
          if [ -z "$SURVEYS_URL" ]; then
            fail_or_skip "AUSMT_SURVEYS_URL is unset - the ts-routes.map drift gate CANNOT run. Set the repo variable AUSMT_SURVEYS_URL (and, for a private repo, the secret AUSMT_SURVEYS_TOKEN) so the R5 route-table membership is verified against the registers"
          fi
          CLONE_URL="$SURVEYS_URL"
          if [ -n "$SURVEYS_TOKEN" ]; then
            case "$SURVEYS_URL" in
              https://*) CLONE_URL="https://x-access-token:${SURVEYS_TOKEN}@${SURVEYS_URL#https://}" ;;
              *) echo "AUSMT_SURVEYS_TOKEN is set but AUSMT_SURVEYS_URL is not an https:// URL; using it as-is" ;;
            esac
          fi
          if [ ! -d "$DEST" ] && ! git clone --depth 1 "$CLONE_URL" "$DEST"; then
            fail_or_skip "AUSMT_SURVEYS_URL is set but the clone of the registers repo FAILED (on a fork PR the AUSMT_SURVEYS_TOKEN secret is unavailable, so a private repo cannot be cloned)"
          fi
          if [ ! -d "$DEST/surveys" ]; then
            fail_or_skip "cloned ausmt-surveys but $DEST/surveys is absent - the registers are not where the generator expects them"
          fi
          python deploy/scripts/gen_ts_routes.py --check --surveys "$DEST/surveys"
