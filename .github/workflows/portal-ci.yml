name: portal-ci

# Lightweight checks for the static portal (the portal/ subtree; it has no build step):
#   1. config.js is in sync with portal.config.yaml (the generated reflection must not drift)
#   2. headless tests: smoke (boots against the committed data/) + jsdom INTERACTION tests
#      (tree toggles, #/collection routing, Find) — the interaction layer's only automated coverage
# The shipped portal has no runtime deps; the interaction tests' jsdom dev-dep is restored via npm ci.
#
# PATH-SCOPED (ADR-001 monorepo): only runs when the portal/ subtree (or this workflow) changes.
#
# ...PLUS the two engine artifacts the portal's own tests read as SINGLE SOURCES. About's
# machine-contract field guide documents the served schema's vocabularies in prose, and
# portal/tests/test_mtcat_machine_contract.py pins that prose set-for-set against
# engine/schema/mtcat.schema.json's enums and against engine/extract/build_portal.py's ACCESS_LEVELS /
# emitter defaults. Scoped to portal/** alone those pins were only a NEXT-PR backstop: a PR adding a
# contributor role or an NCI data level to the schema touches no portal path, so portal-ci never ran and
# the public page went stale green. Listing the two files they read makes the guard a SAME-PR gate. The
# lane stays cheap (it lints and tests the static portal either way) and it does not overlap
# build-products.yml, which runs the engine's own suite over the same paths.
#
# ...AND the documentation tree, for the same reason. Four test modules here read docs/docs/*.md as a
# single source: test_api_docs_section.py and test_docs_static_api.py pin the worked fetch patterns that
# moved off about.html, test_mtcat_machine_contract.py pins the MTCAT field guide, and
# test_docs_vocabulary.py forbids the seismic word "waveform" in the corpus. Scoped to portal/** alone,
# a docs-only PR could delete or contradict any of that and never run the test that guards it. Listing
# docs/docs/** makes those four a same-PR gate rather than a next-PR surprise.
#
# ...AND the documentation site's own build inputs, for the same reason once more.
# test_docs_branding.py reads three files that sit OUTSIDE docs/docs/: the sidebar template
# (docs/overrides/main.html), the mkdocs configuration (docs/mkdocs.yml) and the Read the Docs
# configuration (.readthedocs.yaml). Its regression path is exactly an edit to one of those, so
# without them listed the test could only ever fail on the NEXT PR that happened to touch
# portal/**. Listing them makes the branding and docs-version pins gate their own inputs.

on:
  pull_request:
    paths:
      - "portal/**"
      - "contract/**"
      - "docs/docs/**"
      - "docs/overrides/**"
      - "docs/mkdocs.yml"
      - ".readthedocs.yaml"
      - "engine/schema/**"
      - "engine/extract/build_portal.py"
      # A3: tests/test_add_survey_packaged_yaml.py runs the REAL surveys validator (the vendored
      # pinned copy on CI) over every survey.yaml the form packages, so a validator refresh is an
      # INPUT to this lane and must gate it, exactly as the docs/branding inputs above do.
      - "gateway/tests/fixtures/vendored_validation/**"
      - ".github/workflows/portal-ci.yml"
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "contract/**"
      - "docs/docs/**"
      - "docs/overrides/**"
      - "docs/mkdocs.yml"
      - ".readthedocs.yaml"
      - "engine/schema/**"
      - "engine/extract/build_portal.py"
      # A3: tests/test_add_survey_packaged_yaml.py runs the REAL surveys validator (the vendored
      # pinned copy on CI) over every survey.yaml the form packages, so a validator refresh is an
      # INPUT to this lane and must gate it, exactly as the docs/branding inputs above do.
      - "gateway/tests/fixtures/vendored_validation/**"
      - ".github/workflows/portal-ci.yml"

# C39 (CI minutes economy): cancel a superseded run of the SAME ref. Keyed on github.ref (not a
# fixed group) so a PR run and a push-to-main run — which have different refs — never cancel each
# other; only a newer commit on the same branch/PR supersedes the older, still-queued/running one.
# Matches the per-ref pattern the other three workflows already use (gateway-ci / build-products /
# deploy-images). Safe: this lane only lints/tests the static portal — a cancelled superseded run
# published nothing and had no side effects, so nothing is lost.
concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal   # the static portal lives in portal/ since the ADR-001 merge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tooling
        run: pip install "PyYAML==6.0.3" "pytest==8.2.0"   # pinned to the engine lock's values so a float can't turn the gate red

      # The portal reads the column contract via contract.js (generated from contract/columns.json).
      # Fail if it has drifted from the source (stdlib-only).
      - name: Contract in sync (columns.json -> generated constants)
        run: python ../contract/generate.py --check

      - name: config.js in sync with portal.config.yaml
        run: python tools/gen_config.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install portal dev deps (jsdom, for the interaction tests)
        run: npm ci

      # Lint the guard tests themselves. portal/tests/ was the one body of Python in the repo that no
      # lane linted: build-products.yml's ruff step reaches ../contract and ../portal/tools but not
      # ../portal/tests, and it is not triggered by portal/tests/** anyway, so the tests could only ever
      # have been a next-PR backstop there. This lane already triggers on portal/** and runs the suite,
      # so the lint belongs beside it. Same ruff pin and same engine config as the other two lanes
      # (build-products.yml, gateway-ci.yml): engine/pyproject.toml [tool.ruff] is the single lint policy.
      - name: Lint the guard tests (ruff)
        run: |
          python -m pip install ruff==0.15.17
          python -m ruff check --config ../engine/pyproject.toml tests

      - name: Headless portal smoke + interaction tests
        run: pytest -q tests
