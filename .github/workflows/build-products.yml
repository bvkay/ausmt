name: build-products

# Generates AusMT derived products offline from the engine/ subtree, then publishes them for the
# portal. The portal never runs this stack itself.
#
# mt_metadata/mth5 is the SOLE parsing engine (the dependency-free regex extractor was retired
# ), so it is a core dependency, installed here from
# the pinned lock on the tested Python (3.12). Tier-3 decomposition (the MTpy-v2 fork) is OPTIONAL
# and installed separately; the build does NOT depend on it, so CI stays green without the fork.
#
# PATH-SCOPED: only runs when the engine/ subtree (or this workflow) changes.
#
# ...PLUS the handful of PORTAL files the engine's own tests read as SURFACES OF A SINGLE SOURCE. The
# MTCAT schema version is declared once, in engine/schema/mtcat.schema.json's title, and
# engine/tests/test_mtcat_version_parity.py asserts every surface that restates it still agrees:
# portal.config.yaml, the generated config.js, the committed data/mtcat.json placeholder, gen_config's
# default for a config omitting the key, and version.js's config-missing sentinel. Scoped to engine/**
# alone that pin would only be a NEXT-PR backstop, which is exactly how four separate hardcoded
# defaults accumulated in the first place: a PR editing portal.config.yaml touches no engine path, so
# this lane never ran and the drift shipped. Listing the files the pin reads makes it a SAME-PR gate.
# The named files are cheap to watch and do not overlap portal-ci.yml, which lints and tests the static
# portal over the same paths without running this stack.

on:
  workflow_dispatch:
  push:
    paths:
      - "engine/**"
      - "contract/**"
      - "portal/portal.config.yaml"
      - "portal/config.js"
      - "portal/data/mtcat.json"
      - "portal/tools/gen_config.py"
      - "portal/version.js"
      - ".github/workflows/build-products.yml"
  # Also run on pull requests touching the engine subtree, so a fork/branch PR gets the full
  # engine lane (build + tests + skip accounting) BEFORE merge. Triggering
  # only on push, so a PR that broke the engine showed zero checks here (portal-ci.yml and
  # deploy-images.yml already run on pull_request; this brings build-products.yml into line).
  pull_request:
    paths:
      - "engine/**"
      - "contract/**"
      - "portal/portal.config.yaml"
      - "portal/config.js"
      - "portal/data/mtcat.json"
      - "portal/tools/gen_config.py"
      - "portal/version.js"
      - ".github/workflows/build-products.yml"

concurrency:
  # Keyed on the ref: because this runs on pull_request as well as push, a fixed group would
  # make a PR run and a push-to-main run cancel each other. Per-ref grouping cancels only superseded
  # runs of the SAME branch/PR (matching gateway-ci.yml's pattern).
  group: build-products-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine   # the engine lives in engine/ since the monorepo merge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches the tested/locked mt_metadata/mth5 env

      # The positional column order is single-sourced in contract/columns.json and generated into
      # engine/extract/_contract.py (which this engine imports). Fail the build if the generated file
      # is out of sync with the source (stdlib-only; runs before the heavy installs).
      - name: Contract in sync (columns.json -> generated constants)
        run: python ../contract/generate.py --check

      # Lint: broad ruff (E/F/PL/BLE) with the project's documented ignores in pyproject.toml [tool.ruff].
      # Fast + dependency-light, so it runs before the heavy engine install. --config forces the engine's
      # ruff config onto the sibling contract/ and portal/tools/ Python too.
      - name: Lint (ruff)
        run: |
          python -m pip install ruff==0.15.17
          python -m ruff check --config pyproject.toml . ../contract ../portal/tools

      # Core runtime = the pinned mt_metadata/mth5 stack (the sole extractor) + the test deps + the
      # package. The LOCK (verified transitive closure) installs the exact numpy/scipy/pandas/xarray/
      # pydantic pins so nothing floats against latest PyPI — normalize()'s metadata-conditioning is
      # sensitive to it. Production hardening: swap for a prebuilt container image of this same lock.
      - name: Install pinned engine + test deps + package
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
          pip install -r environments/requirements-mtmetadata-lock.txt
          pip install --no-deps -e .

      # Tier-3 ONLY: decomposition fork pinned to a COMMIT (never a branch).
      # Set repo variable DECOMP_COMMIT to enable; if unset, this step is skipped
      # and the build still produces Tier 0-2 products.
      - name: Install decomposition engine (optional, Tier 3)
        if: ${{ vars.DECOMP_COMMIT != '' }}
        run: pip install "mtpy-v2 @ git+https://github.com/bvkay/mtpy-v2.git@${{ vars.DECOMP_COMMIT }}"

      # THE PER-PR RUN IS A GATE SUBSET; THE FULL HOST-ENV SUITE RUNS ON PUSH AND DISPATCH.
      # Measured per-job Actions timings showed PR CI's ~37 min
      # wall-clock was ONE ~650-test suite run twice, single-threaded: 36.1 min HERE on the host
      # runner and 34.3 min inside the shipped image (deploy-images.yml's engine-full-tests). The
      # in-image run is the trust-invariant one (it tests the artifact that ships), so THAT keeps
      # the full suite on every PR; THIS lane's per-PR run narrows to the subset that gates what
      # this workflow's own steps do and rely on (the product/equivalence/schema set):
      #   tests/test_build_cache.py cache seams incl. the section-4.5 warm-vs-refresh
      #                                       byte-equivalence guard and the stale-cache refusal the
      #                                       "Build-cache smoke" step below leans on
      #   tests/test_ingest_normalize.py      canonical-ingest round-trip gate (named above)
      #   tests/test_canonical_parity.py      science parity through the canonical store (the old
      #                                       extractor-parity job's coverage, named above)
      #   tests/test_canonical_store.py       the --canonical-dir emission gate (named above)
      #   tests/test_mth5_roundtrip.py        EDI->MTH5->products equivalence; partner of the
      #                                       "MTH5 ingestion round-trip (evidence)" step below
      #   tests/test_mtcat.py                 mtcat.json product emission against the schema
      #   tests/test_mtcat_schema_v20.py      the schema that constrains the served catalogue
      #   tests/test_mtcat20_emission.py      the 2.0 emitter semantics (migrate_12_to_20 at source)
      #   tests/test_mtcat20_invariants.py    the invariant suite (schema, scans, rollups)
      #   tests/test_mtcat_version_parity.py  the same-PR portal-surface pin: the reason this
      #                                       workflow watches the five portal paths at all
      #   tests/test_survey_metadata_version_parity.py  the survey-metadata version single-source pin
      #   tests/test_survey_metadata_schema_v01.py      the 0.1 schema that constrains survey-metadata.json
      #   tests/test_survey_metadata_emission.py        the survey-metadata emitter semantics, the hard stop
      #                                       and the loud skip on a dropped survey
      #   tests/test_survey_metadata_invariants.py      the survey-metadata invariant suite (built output:
      #                                       identity chain, projection chains, scans, schema routes)
      #   tests/test_station_write_path.py    station.json at the served root, with or without --products
      #   tests/test_station_version_parity.py  the station version single-source pin
      #   tests/test_station_schema_v01.py    the 0.1 schema that constrains the promoted station.json
      #   tests/test_presence_rule.py         no mt_metadata default is ever emitted as a source assertion
      #   tests/test_run_facts.py             the six >INFO dialect extractors for acquisition facts
      #   tests/test_station_runs.py          runs[] emission: the run gate, the channel rule
      #   tests/test_ts_index_register.py     the offline verified-resource register: the opt-in flag,
      #                                       the closed vocabularies, the unmatched-station stop
      #   tests/test_station_resources.py     resources[] from the manifest rows, kinds and role axes
      #   tests/test_station_time_series.py   kind=time_series rows from the register: the route, the
      #                                       vocabularies, the day-by-state exclusion, the access gate and
      #                                       the ts_access.json boot artifact it renders beside them
      #   tests/test_ts_projection.py         the ONE projection: existence follows the register,
      #                                       route detail follows the gate, level2 opens nothing
      #   tests/test_access_gate.py           the access gate over BUILT output, INCLUDING the
      #                                       root-level leak sweep: no NCI path, filename or size for
      #                                       a withheld, request-only or pending station reaches
      #                                       ts_access.json, mtcat.json or the pointer file
      #   tests/test_url_registry.py          the published-URL freeze, and the negative that keeps a
      #                                       /go/ts/ hand-off route out of the sitemap for good
      #   tests/test_ts_url_vectors.py        the ONE percent-encoder, against the shared vector file
      #                                       the portal's JS mirror and the front door's route-table
      #                                       generator are held to as well
      #   tests/test_station_semantics.py     the semantic layer beyond JSON Schema, in the build and
      #                                       at both of verify.py's wiring sites
      #   tests/test_station_emission.py      station.json emission semantics over BUILT output: the
      #                                       key sets, the dimensionality fold, the leak rejections
      #   tests/test_station_invariants.py    the station invariant suite (built output: identity
      #                                       chain, schema routes, the drawer and CI-guard pins)
      #   tests/test_empty_build.py           the empty-input default-products contract behind the
      #                                       build step's "fails on empty output" guarantee
      #   tests/test_proc_note_email_scrub.py the PII redaction the email-guard step backstops
      #   tests/test_golden_edi.py            golden pins on the sole engine's product outputs
      #   tests/test_mini_yaml_parity.py      PyYAML-vs-_mini_yaml survey.yaml projection parity
      #   tests/test_index_pages.py           the two tier-3 hub pages (/surveys, /collections):
      #                                       emitted from the catalogue rollups under the same
      #                                       --sitemap-base flag as every other page, the
      #                                       shared-outline byte budget, and the rule that a hub
      #                                       page never advertises an entity the build did not write
      #   tests/test_entity_pages.py          the tier-3 entity pages. Listed for the projection
      #                                       family, not for the templates: station pages now render
      #                                       their time-series routes from ts_access.json, so this
      #                                       file asserts over a projection surface and the rule
      #                                       below requires it here
      #   tests/test_epikit_section_of_record.py  which >=MTSECT section a multi-section EDI's
      #                                       transfer function comes from. It decides WHICH NUMBERS
      #                                       every product above carries for such a file, so it
      #                                       gates this workflow's build step as directly as the
      #                                       schema tests do
      #   tests/test_epikit_dataid_charset.py the DATAID normalisation that lets a station the
      #                                       reader's name validator refuses publish at all, plus
      #                                       the pre-flight verdict that has to move with it
      #   tests/test_epikit_parse_failure_gate.py  the deploy gate over build_report's
      #                                       source_parse_failures, and the rule-8 pin that keeps
      #                                       this list honest for the whole test_epikit_* family
      #   tests/test_comment_hygiene.py        the comment rule over engine/extract, engine/scripts and
      #                                       this suite, plus the byte cap on the stylesheet
      #                                       _pages.py inlines into every emitted page. Reads only
      #                                       paths under engine/, so it runs unchanged in the image
      #                                       lanes where portal/, docs/ and .github/ are not shipped.
      #   tests/test_cli_help_identity.py      the operator text of every argparse module here: a
      #                                       docstring IS the interface a --help prints, so the
      #                                       behaviour guard that blanks docstrings cannot see a
      #                                       long flag that lost a hyphen. Reads only engine/ and
      #                                       contract/, both of which the image ships.
      # (the 47 enumerated above, plus tests/test_ci_check_skips.py which gates the
      #  skip tripwire itself; the counts move with the suite.)
      # The last three are named by what they ASSERT ABOUT rather than by what they are called, and
      # engine/tests/test_station_invariants.py mechanises exactly that: any test file naming one of
      # the four time-series projection surfaces (ts_access.json, has_time_series, /go/ts/ and the
      # shared ts_url_vectors.json) must be listed here, so the next one is caught on the PR that
      # adds it whatever it is named.
      #
      # RESIDUAL RISK, STATED HONESTLY: a HOST-ENV-ONLY failure in an out-of-subset test now
      # surfaces on the push-to-main full run, not on the PR. Accepted because the in-image full
      # suite still gates every PR (deploy-images.yml engine-full-tests) and the two environments
      # rarely diverge: both install the same committed lock, so slipping through needs a
      # host-runner quirk the image misses AND that only an out-of-subset test can see. The full
      # host-env run still lands on every push to main and on workflow_dispatch: those are this
      # repo's existing trigger conventions (none of the four workflows uses cron, and this one
      # already carries both triggers), so main coverage costs no new trigger surface.
      #
      # -n 4 on both forms: pytest-xdist from requirements-dev.txt (installed above, constrained by
      # the lock). ubuntu-latest exposes 4 vCPUs and the suite is CPU-bound (dev box:
      # 656 tests, 673s serial vs 185s under -n 4, a 3.6x speedup). Parallel safety was proven on
      # the dev box first: identical per-test outcomes serial and under -n 4, zero xdist-only
      # failures, zero xdist_group serial pins (the one defect found was a nondeterministic
      # parametrize id in the schema suite, then test_mtcat_schema_v12.py, fixed at its source), and the -rs skip-line
      # format was proven to survive xdist against ci_check_skips.py (green and red legs) at the
      # pinned pytest 8.2.0 + pytest-xdist 3.8.0.
      #
      # -rs surfaces every skip reason: ~20 files importorskip mt_metadata/mth5, so if the pinned
      # lock ever silently stopped installing that stack the release gate would go green over a
      # hollowed-out suite. The tripwire fails on any skip not on tests/ci_check_skips.py's
      # allow-list. In THIS lane the mt_metadata/mth5 stack IS installed (the lock above) and there is
      # no sibling ausmt-surveys checkout, so the only legitimate skips are the allow-listed
      # dev-box-only ones (realdata corpus / preflight corpus); the subset carries neither of those
      # files, so its expected skip count is ONE: tests/test_url_registry.py's real-build arm, which
      # re-runs the slug/id freeze against an actual BUILT corpus (AUSMT_URL_REGISTRY_DATA) that no
      # CI lane produces. That reason is already on the tripwire's allow-list, and the rest of that
      # file - the fixture behaviour, the committed registry, the /go/ts/ negative - runs here.
      - name: Tests, PR gate subset (product/equivalence/schema; with skip accounting)
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          pytest -q -rs -n 4 \
            tests/test_build_cache.py \
            tests/test_ingest_normalize.py \
            tests/test_canonical_parity.py \
            tests/test_canonical_store.py \
            tests/test_mth5_roundtrip.py \
            tests/test_mtcat.py \
            tests/test_mtcat_schema_v20.py \
            tests/test_mtcat20_emission.py \
            tests/test_mtcat20_invariants.py \
            tests/test_mtcat_version_parity.py \
            tests/test_survey_metadata_version_parity.py \
            tests/test_survey_metadata_schema_v01.py \
            tests/test_survey_metadata_emission.py \
            tests/test_survey_metadata_invariants.py \
            tests/test_station_write_path.py \
            tests/test_station_version_parity.py \
            tests/test_station_schema_v01.py \
            tests/test_presence_rule.py \
            tests/test_run_facts.py \
            tests/test_station_runs.py \
            tests/test_ts_index_register.py \
            tests/test_station_resources.py \
            tests/test_station_time_series.py \
            tests/test_ts_projection.py \
            tests/test_access_gate.py \
            tests/test_url_registry.py \
            tests/test_ts_url_vectors.py \
            tests/test_station_semantics.py \
            tests/test_station_emission.py \
            tests/test_station_invariants.py \
            tests/test_empty_build.py \
            tests/test_proc_note_email_scrub.py \
            tests/test_golden_edi.py \
            tests/test_mini_yaml_parity.py \
            tests/test_index_pages.py \
            tests/test_entity_pages.py \
            tests/test_half_coordinate_guard.py \
            tests/test_coord_resolution_guard.py \
            tests/test_survey_drop_visibility.py \
            tests/test_epikit_section_of_record.py \
            tests/test_epikit_dataid_charset.py \
            tests/test_epikit_parse_failure_gate.py \
            tests/test_epikit_remote_reference.py \
            tests/test_parse_failure_accounting.py \
            tests/test_reference_coordinate_sign.py \
            tests/test_stations_dropped_gate.py \
            tests/test_comment_hygiene.py \
            tests/test_cli_help_identity.py \
            tests/test_ci_check_skips.py \
            | tee /tmp/pytest-engine.out
          python tests/ci_check_skips.py < /tmp/pytest-engine.out

      # Full suite. With mt_metadata present the canonical-ingest / parity / canonical-store /
      # mth5-roundtrip gates RUN (they importorskip only when the stack is absent), so this single
      # job covers extractor parity as well. This suite also carries
      # the build-cache tests (tests/test_build_cache.py), INCLUDING the warm-vs-refresh
      # byte-equivalence guard and the ★ stale-cache refusal — so a cache change that altered output
      # bytes fails CI here.
      - name: Tests, full suite (push and dispatch; with skip accounting)
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          pytest -q -rs -n 4 tests | tee /tmp/pytest-engine.out
          python tests/ci_check_skips.py < /tmp/pytest-engine.out

      # Exercise the incremental cache end-to-end in CI while the checkout is still CLEAN (this
      # step runs BEFORE the product build below, which writes site-data/ into the tree and would make
      # git status non-empty -> a degenerate salt that self-disables the cache). A full --cache-mode
      # refresh build POPULATES a scratch cache; a warm rw build must then HIT it with zero misses.
      # The build succeeds either way; the byte-EQUIVALENCE between refresh and warm is asserted by
      # the equivalence test inside the Tests step above (BOTH its forms run
      # tests/test_build_cache.py: the PR subset carries it by name, the full suite by inclusion).
      # This scratch cache is throwaway and is
      # NOT the published products (those come from the non-incremental build step below).
      - name: Build-cache smoke (refresh populate -> warm hit; clean-checkout salt)
        run: |
          python -m extract.build_portal --surveys data --out /tmp/c18-pop \
            --bundle-edi --no-validate --incremental --cache-dir /tmp/c18-cache --cache-mode refresh
          python -m extract.build_portal --surveys data --out /tmp/c18-warm \
            --bundle-edi --no-validate --incremental --cache-dir /tmp/c18-cache --cache-mode rw
          python - <<'PY'
          import json
          c = json.load(open("/tmp/c18-warm/build_provenance.json"))["cache"]
          assert c["enabled"] and c["hits"] > 0 and c["misses"] == 0 and c["writes"] == 0, c
          print("C18 warm-build cache counters:", c)
          PY

      # --no-validate: this checkout has no ausmt-surveys sibling (private repo, no token for a
      # cross-repo checkout here), so the validator can never resolve -- and that is now a
      # hard error, not a warning. This is fine: `data/` is the trusted in-repo sample, not real
      # submissions. The real gate runs in ausmt-surveys CI (validate.yml + tests.yml) and again at
      # ingest; this build step only proves the pipeline itself still runs end-to-end.
      #
      # The CI-PUBLISHED products are built NON-incremental (no --incremental flag) - CI products
      # are never cache-derived. The build cache only ever accelerates the production
      # deploy/Makefile rebuild-data; here we prove the full cold pipeline still runs end-to-end.
      - name: Build products (single canonical pipeline; fails on empty output)
        run: |
          python -m extract.build_portal \
            --surveys data --out site-data --products products --bundle-edi --no-validate

      # CI guard, PII scrub: derived JSON/XML must never carry an email address (station.json
      # processing.note is the known vector -- proc_note() redacts it, this is the belt-and-braces
      # net for anything else that scrapes free text). Excludes edi/** -- those are the served
      # ORIGINAL .edi bytes, the custodian's published record, never mutated and out of scope
      # here. Fails loudly and prints offenders rather than silently passing a dirty build.
      #
      # BOTH trees the build step above writes are scanned. The guard grepped --out alone, which left
      # the whole --products tree (every station.json and dimensionality.json written there) outside
      # a check whose whole subject is per-station free text. Pinned by
      # engine/tests/test_station_invariants.py, which reads the tree names off the build step's own
      # arguments so the two cannot drift apart again.
      - name: PII guard — no email addresses in derived products
        run: |
          set -e
          HITS=$(grep -RlE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' site-data products \
                 --exclude-dir=edi || true)
          if [ -n "$HITS" ]; then
            echo "ERROR: email address(es) found in derived products (must be redacted before publish):"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no email addresses in either derived tree (excluding served original edi/**)"

      # MTH5 ingestion round-trip evidence (EDI-mt_metadata vs MTH5-mth5), uploaded with the products.
      - name: MTH5 ingestion round-trip (evidence)
        run: python -m extract.compare_mth5 --edis data --out mth5_roundtrip.json

      # Artifact paths are repo-root-relative (working-directory does NOT apply to `uses:` steps).
      - uses: actions/upload-artifact@v4
        with:
          name: ausmt-products
          path: |
            engine/products/
            engine/site-data/
            engine/mth5_roundtrip.json

      # NOTE: no gh-pages "Deploy portal data to Pages" step runs here; it was
      # REMOVED. It was vestigial first-CI wiring (predates the EliteDesk deployment), had NEVER
      # succeeded (no gh-pages branch was ever created; the read-only GITHUB_TOKEN 403'd the push,
      # reddening every engine-touching push to main), and publishing even sample data publicly
      # should be a deliberate decision (a public read mirror), not a
      # CI side effect. If a Pages data mirror is ever wanted, design it against the REAL corpus
      # (surveys-live) with explicit `permissions: contents: write` scoped to that job — do not
      # resurrect this step as-was.
