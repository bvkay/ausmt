# AusMT front-door boot ordering (ops-hardening O2, 2026-07-25). A systemd DROP-IN for docker.service
# on the VPS. It fixes the post-reboot 502 incident: on boot the Docker daemon (and therefore the
# restart:unless-stopped frontdoor container) came up BEFORE tailscaled, so Caddy tried to resolve the
# box's tailnet MagicDNS upstream while the tailnet resolver did not yet exist. The failed resolve stuck
# and the edge served 502 everywhere until a manual `docker compose restart frontdoor`.
#
# This drop-in orders the Docker daemon AFTER tailscaled, so the container never starts before the
# tailnet resolver is present. It does NOT create a hard dependency (no Requires=): if tailscaled is
# absent or slow the daemon still starts eventually, it just waits for the ordering point first. That
# keeps a box with no tailnet (a pure-local dev host) bootable.
#
# WHY ordering and not a healthcheck-driven restart: the container's existing healthcheck probes its own
# :80 listener, which is UP even when the box upstream is dead, so restart:unless-stopped never fires on
# an upstream-resolve failure. Coupling edge health to the box (probing the upstream) would restart-loop
# the edge on any box blip. Ordering removes the boot RACE at its root and leaves box outages to the
# documented one-command recovery (`docker compose restart frontdoor`, RUNBOOK.md section 11).
#
# INSTALL (on the VPS, as root):
#   sudo mkdir -p /etc/systemd/system/docker.service.d
#   sudo cp deploy/frontdoor/docker-after-tailscaled.conf /etc/systemd/system/docker.service.d/
#   sudo systemctl daemon-reload
#   systemctl show docker.service -p After | tr ' ' '\n' | grep tailscaled   # confirm the ordering
#
# NOTE: ordering guarantees tailscaled has STARTED, not that the tailnet is fully routable, so a very
# fast boot can still catch a brief resolve window. It shrinks the race to near zero; the manual
# recovery in RUNBOOK.md section 11 covers the residual case. Reversible: delete the drop-in file and
# `systemctl daemon-reload`.

[Unit]
After=tailscaled.service
Wants=tailscaled.service
